repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --python-version=3.10]
        additional_dependencies: [types-requests]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: .venv/bin/python -m pytest tests/test_game.py tests/test_websocket.py tests/test_api.py -v
        language: script
        types: [python]
        pass_filenames: false

      # language: system, а не script: script ищет entry относительно корня
      # репозитория (для .venv/bin/python выше это верно), а node живёт в PATH.
      # Кавычки вокруг шаблона обязательны — аргумент-каталог node не понимает;
      # pre-commit запускает команду без шелла, поэтому шаблон достаётся node.
      - id: node-test
        name: node --test
        entry: node --test 'tests/js/*.test.js'
        language: system
        types: [javascript]
        pass_filenames: false
